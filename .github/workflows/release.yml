# Releases Vitesse on its own: once CI is green on master, a version of Cargo.toml
# that has no tag yet gets its tag (v0.1.0 for 0.1.0) and its GitHub release, with
# the notes of its section in CHANGELOG.md, then the crate is published on
# crates.io. Nothing to fill in by hand: change `version` in Cargo.toml, write the
# changelog section, push.
#
# A release drafted by hand (Releases → Draft a new release) publishes too, and the
# Actions tab runs it by hand (a dry run by default).
#
# Setup: repository secret CARGO_REGISTRY_TOKEN, a crates.io API token with
# the "publish-new" and "publish-update" scopes (crates.io → Account Settings
# → API Tokens). Without it, the automatic release still tags the version and
# creates its GitHub release, and leaves the publication for later.

name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only check the package (cargo publish --dry-run)"
        type: boolean
        default: true

env:
  CARGO_TERM_COLOR: always

jobs:
  tag:
    name: Tag the new version
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      created: ${{ steps.release.outputs.created }}
      sha: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Release the version of Cargo.toml if it is new
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "vitesse") | .version')
          tag="v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "$tag already exists: nothing to release."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The notes: the section of this version in CHANGELOG.md.
          awk -v head="## [$version]" 'index($0, head) == 1 { on = 1; next } on && /^## \[/ { exit } on' CHANGELOG.md > notes.md
          if [ -s notes.md ]; then
            gh release create "$tag" --target "$SHA" --title "$tag" --notes-file notes.md
          else
            gh release create "$tag" --target "$SHA" --title "$tag" --generate-notes
          fi
          echo "created=true" >> "$GITHUB_OUTPUT"
          echo "### 🏷️ [$tag]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$tag) released" >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish to crates.io
    needs: tag
    # `needs` skips this job for the other events unless `always()` lets them through.
    if: >-
      always() &&
      (github.event_name != 'workflow_run' || needs.tag.outputs.created == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag.outputs.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Check that the tag matches the version
        if: github.event_name == 'release'
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "vitesse") | .version')
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$version" ]; then
            echo "::error::The release tag ($GITHUB_REF_NAME) does not match the version in Cargo.toml ($version)."
            exit 1
          fi

      # On the automatic release, a missing token only postpones the publication.
      - name: Ready to publish
        id: ready
        env:
          AUTOMATIC: ${{ github.event_name == 'workflow_run' }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ "$AUTOMATIC" = "true" ] && [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::notice::Released on GitHub; add the CARGO_REGISTRY_TOKEN secret to publish on crates.io too, then run this workflow by hand."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.ready.outputs.ready == 'true'
        run: cargo test --locked

      - name: Dry run
        if: steps.ready.outputs.ready == 'true' && github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: cargo publish --locked --dry-run

      - name: Publish
        if: steps.ready.outputs.ready == 'true' && (github.event_name != 'workflow_dispatch' || !inputs.dry_run)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error::Add the CARGO_REGISTRY_TOKEN secret (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "vitesse") | .version')
          if curl -sf -A "vitesse-release (github.com/maxlestage/Vitesse)" "https://crates.io/api/v1/crates/vitesse/$version" > /dev/null; then
            echo "vitesse $version is already on crates.io."
          else
            cargo publish --locked
          fi
          echo "### 📦 Published on [crates.io/crates/vitesse](https://crates.io/crates/vitesse)" >> "$GITHUB_STEP_SUMMARY"
