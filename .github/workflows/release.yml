# Publishes the crate on crates.io when a GitHub release is published (this
# can be done from a phone: Releases → Draft a new release → tag v0.1.0 →
# Publish release), or manually from the Actions tab.
#
# Setup: repository secret CARGO_REGISTRY_TOKEN, a crates.io API token with
# the "publish-new" and "publish-update" scopes (crates.io → Account Settings
# → API Tokens).

name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only check the package (cargo publish --dry-run)"
        type: boolean
        default: true

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Check that the tag matches the version
        if: github.event_name == 'release'
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "vitesse") | .version')
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$version" ]; then
            echo "::error::The release tag ($GITHUB_REF_NAME) does not match the version in Cargo.toml ($version)."
            exit 1
          fi

      - run: cargo test --locked

      - name: Dry run
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: cargo publish --locked --dry-run

      - name: Publish
        if: github.event_name == 'release' || !inputs.dry_run
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error::Add the CARGO_REGISTRY_TOKEN secret (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          cargo publish --locked
