[package]
name = "vitesse"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "An Express.js-style web framework in native Rust, built for speed: familiar API (app.get, req.params, middleware, Router), its own HTTP/1.1 engine on tokio."
authors = ["Maxime Lestage"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/maxlestage/Vitesse"
homepage = "https://maxlestage.github.io/Vitesse/"
documentation = "https://docs.rs/vitesse"
readme = "README.md"
keywords = ["web", "http", "framework", "express", "server"]
categories = ["web-programming::http-server", "network-programming", "asynchronous"]
# The published package only contains the library (not the website, the
# docs or the benchmarks).
include = [
    "/src",
    "/examples",
    "/tests",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
]

[dependencies]
bytes = "1"
form_urlencoded = "1"
futures-core = "0.3"
http = "1"
http-body = "1"
http-body-util = "0.1"
httparse = "1.10"
pin-project-lite = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
socket2 = { version = "0.6", features = ["all"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "time", "fs", "io-util", "signal", "sync", "macros"] }

[dev-dependencies]
futures-core = "0.3"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["full"] }

[profile.release]
lto = "fat"
codegen-units = 1

# `cargo build --profile profiling`: like release, with what perf needs.
[profile.profiling]
inherits = "release"
debug = "line-tables-only"
