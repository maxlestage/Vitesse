[package]
name = "vitesse"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Un framework web minimaliste à la Express.js, écrit en Rust natif et pensé pour la vitesse."
repository = "https://github.com/maxlestage/vitesse"
readme = "README.md"
keywords = ["web", "http", "framework", "express", "server"]
categories = ["web-programming::http-server"]

[dependencies]
bytes = "1"
form_urlencoded = "1"
futures-core = "0.3"
http = "1"
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "server-graceful", "http1"] }
pin-project-lite = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
socket2 = { version = "0.6", features = ["all"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "time", "fs", "io-util", "signal", "sync", "macros"] }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["full"] }

[profile.release]
lto = "fat"
codegen-units = 1
