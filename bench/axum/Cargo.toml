[package]
name = "bench-axum"
version = "0.0.0"
edition = "2024"
publish = false

# Crate indépendante : ne fait pas partie du build de Vitesse.
[workspace]

[dependencies]
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[profile.release]
lto = "fat"
codegen-units = 1
