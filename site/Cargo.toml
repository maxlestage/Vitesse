[package]
name = "vitesse-site"
version = "0.1.0"
edition = "2024"
publish = false
description = "Le site de présentation de Vitesse, écrit en Rust avec Yew (WebAssembly)."

# Crate indépendante : ne fait pas partie du build de Vitesse.
[workspace]

[dependencies]
yew = { version = "0.23", features = ["csr"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
gloo-timers = "0.3"
gloo-events = "0.2"
wasm-bindgen-futures = "0.4"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
web-sys = { version = "0.3", features = [
  "AddEventListenerOptions",
  "CanvasRenderingContext2d",
  "CssStyleDeclaration",
  "Document",
  "DomRect",
  "DomTokenList",
  "Element",
  "EventTarget",
  "HtmlCanvasElement",
  "HtmlElement",
  "HtmlInputElement",
  "KeyboardEvent",
  "Location",
  "Response",
  "ScrollBehavior",
  "ScrollIntoViewOptions",
  "ScrollLogicalPosition",
  "Storage",
  "IntersectionObserver",
  "IntersectionObserverEntry",
  "IntersectionObserverInit",
  "MediaQueryList",
  "MouseEvent",
  "Navigator",
  "Clipboard",
  "NodeList",
  "Window",
  "HtmlDocument",
  "HtmlHeadElement",
  "HtmlMetaElement",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
